# A6: extrapolating the observation by an expected latency, constant-velocity hazards (live-range suite).
name: sim_ghost_cv
notes: 'A6: extrapolating the observation by an expected latency, constant-velocity
  hazards (live-range suite).'
suite:
  name: live-range
  n: 60
  base_seed: 20000
  budget_min_s: 0.4
  budget_max_s: 4.0
  mix:
    obstacle_static: 0.4
    obstacle_approach: 0.3
    intruder_cross: 0.2
    battery_critical: 0.05
    gps_loss: 0.05
  n_impossible: 0
latency_sweep_ms:
- 200
- 400
- 700
shield:
- 0
cadence:
- sequential
reps: 1
arms:
- id: fsm
  kind: fsm
  measured: false
- id: predict_fsm_200
  kind: predict_fsm
  config:
    expected_ms: 200
  measured: false
- id: predict_fsm_400
  kind: predict_fsm
  config:
    expected_ms: 400
  measured: false
- id: predict_fsm_700
  kind: predict_fsm
  config:
    expected_ms: 700
  measured: false
- id: reflex_ttc
  kind: reflex_ttc
  measured: false
- id: predict_reflex_ttc_400
  kind: predict_reflex_ttc
  config:
    expected_ms: 400
  measured: false
