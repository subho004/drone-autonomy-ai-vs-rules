# Live models flying the gates task (first 12 certified scenarios), measured latency.
name: sim_live_gates
notes: Live models flying the gates task (first 12 certified scenarios), measured
  latency.
suite:
  name: gates
  kind: gates
  n: 24
  base_seed: 5500
latency_sweep_ms: []
shield:
- 0
cadence:
- sequential
reps: 1
arms:
- id: gate_pilot
  kind: gate_pilot
  sweep: false
  measured: true
  subsample: 12
- id: jev
  provider: decisions_endpoint
  model: typesafe/jev-1.13
  pool: api
  sweep: false
  measured: true
  subsample: 12
- id: mercury
  provider: decisions_endpoint
  model: inception/mercury-decide:free
  pool: api
  sweep: false
  measured: true
  subsample: 12
- id: gpt-4o-mini
  provider: openai_chat
  model: gpt-4o-mini
  pool: api
  config:
    top_logprobs: 20
  sweep: false
  measured: true
  subsample: 12
- id: gemini-flash-lite
  provider: gemini
  model: gemini-3.5-flash-lite
  pool: api
  config:
    thinking_level: minimal
    max_output_tokens: 16
  sweep: false
  measured: true
  subsample: 12
